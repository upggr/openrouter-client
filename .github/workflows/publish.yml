name: Publish to VS Code Marketplace
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The Marketplace refuses a version twice, so this publishes only after a version bump.
      - run: npx vsce publish --oidc --skip-duplicate
      # Attach the .vsix to a GitHub Release. Skipped silently when the version did not change.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if git rev-parse "v$VERSION" >/dev/null 2>&1 || gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists, skipping."
            exit 0
          fi
          npx vsce package -o "openrouter-client-$VERSION.vsix"
          NOTES=$(awk '/^## '"$VERSION"'$/{found=1; next} found && /^## /{exit} found' CHANGELOG.md | sed '/^$/d')
          gh release create "v$VERSION" "openrouter-client-$VERSION.vsix" --title "OpenRouter Client $VERSION" --notes "$NOTES"
